<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Combined Database API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .test-section h3 { margin-top: 0; color: #333; }
        button { background: #007cba; color: white; border: none; padding: 10px 15px; margin: 5px; border-radius: 3px; cursor: pointer; }
        button:hover { background: #005a8b; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 3px; white-space: pre-wrap; }
        .success { border-left: 4px solid #28a745; }
        .error { border-left: 4px solid #dc3545; }
        input, select { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>Combined Database API Test Suite</h1>
    <p>Test all API endpoints with the new combined database structure.</p>
    
    <div class="test-section">
        <h3>1. Database Connection Test</h3>
        <button onclick="testConnection()">Test Connection</button>
        <div id="connection-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>2. Migration Test</h3>
        <button onclick="runMigration()">Run Sample Data Migration</button>
        <div id="migration-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>3. Authentication Tests</h3>
        <div>
            <label>Student ID: </label>
            <input type="text" id="login-student-id" value="2023001" placeholder="Student ID">
            <label>Password: </label>
            <input type="password" id="login-password" value="2023001" placeholder="Password">
            <button onclick="testLogin()">Test Login</button>
        </div>
        <div id="login-result" class="result"></div>
        
        <div style="margin-top: 15px;">
            <h4>Registration Test</h4>
            <input type="text" id="reg-student-id" value="2023999" placeholder="Student ID">
            <input type="text" id="reg-name" value="Test, Student" placeholder="Surname, Firstname">
            <input type="password" id="reg-password" value="2023999" placeholder="Password">
            <input type="text" id="reg-year" value="Grade 12" placeholder="Year Level">
            <input type="text" id="reg-course" value="BSCS" placeholder="Course">
            <input type="text" id="reg-section" value="CS1MA" placeholder="Section">
            <button onclick="testRegister()">Test Register</button>
        </div>
        <div id="register-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>4. Violations Test</h3>
        <label>Student ID: </label>
        <input type="text" id="violations-student-id" value="2023001" placeholder="Student ID">
        <button onclick="testViolations()">Get Violations</button>
        <div id="violations-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>5. Attendance Test</h3>
        <label>Student ID: </label>
        <input type="text" id="attendance-student-id" value="2023001" placeholder="Student ID">
        <label>Month: </label>
        <input type="number" id="attendance-month" value="12" placeholder="Month" min="1" max="12">
        <label>Year: </label>
        <input type="number" id="attendance-year" value="2024" placeholder="Year">
        <button onclick="testAttendance()">Get Attendance</button>
        <div id="attendance-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>6. Student Update Test</h3>
        <label>Student ID: </label>
        <input type="text" id="update-student-id" value="2023001" placeholder="Student ID">
        <label>Year: </label>
        <input type="text" id="update-year" value="Grade 12" placeholder="Year Level">
        <label>Course: </label>
        <input type="text" id="update-course" value="BSCS" placeholder="Course">
        <label>Section: </label>
        <input type="text" id="update-section" value="BS1MA" placeholder="Section">
        <button onclick="testStudentUpdate()">Update Student</button>
        <div id="update-result" class="result"></div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8080/backend';

        function displayResult(elementId, response, isSuccess) {
            const element = document.getElementById(elementId);
            element.textContent = JSON.stringify(response, null, 2);
            element.className = `result ${isSuccess ? 'success' : 'error'}`;
        }

        async function makeRequest(url, options = {}) {
            try {
                const response = await fetch(url, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                const data = await response.json();
                return { data, isSuccess: response.ok && data.success !== false };
            } catch (error) {
                return { data: { error: error.message }, isSuccess: false };
            }
        }

        async function testConnection() {
            const { data, isSuccess } = await makeRequest(`${BASE_URL}/test_connection.php`);
            displayResult('connection-result', data, isSuccess);
        }

        async function runMigration() {
            const { data, isSuccess } = await makeRequest(`${BASE_URL}/migrate_to_combined_db.php`);
            displayResult('migration-result', data, isSuccess);
        }

        async function testLogin() {
            const studentId = document.getElementById('login-student-id').value;
            const password = document.getElementById('login-password').value;
            
            const { data, isSuccess } = await makeRequest(`${BASE_URL}/auth/login.php`, {
                method: 'POST',
                body: JSON.stringify({ student_id: studentId, password: password })
            });
            displayResult('login-result', data, isSuccess);
        }

        async function testRegister() {
            const registerData = {
                student_id: document.getElementById('reg-student-id').value,
                name: document.getElementById('reg-name').value,
                password: document.getElementById('reg-password').value,
                year: document.getElementById('reg-year').value,
                course: document.getElementById('reg-course').value,
                section: document.getElementById('reg-section').value
            };
            
            const { data, isSuccess } = await makeRequest(`${BASE_URL}/auth/register.php`, {
                method: 'POST',
                body: JSON.stringify(registerData)
            });
            displayResult('register-result', data, isSuccess);
        }

        async function testViolations() {
            const studentId = document.getElementById('violations-student-id').value;
            const { data, isSuccess } = await makeRequest(`${BASE_URL}/violations/${studentId}`);
            displayResult('violations-result', data, isSuccess);
        }

        async function testAttendance() {
            const studentId = document.getElementById('attendance-student-id').value;
            const month = document.getElementById('attendance-month').value;
            const year = document.getElementById('attendance-year').value;
            
            const { data, isSuccess } = await makeRequest(`${BASE_URL}/attendance/${studentId}?month=${month}&year=${year}`);
            displayResult('attendance-result', data, isSuccess);
        }

        async function testStudentUpdate() {
            const updateData = {
                student_id: document.getElementById('update-student-id').value,
                year: document.getElementById('update-year').value,
                course: document.getElementById('update-course').value,
                section: document.getElementById('update-section').value
            };
            
            const { data, isSuccess } = await makeRequest(`${BASE_URL}/student/update.php`, {
                method: 'PUT',
                body: JSON.stringify(updateData)
            });
            displayResult('update-result', data, isSuccess);
        }

        // Auto-test connection on page load
        window.onload = function() {
            testConnection();
        };
    </script>
</body>
</html>
